name: Feature request
description: Suggest an improvement to ocprobe
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow that is slow, unsafe or missing today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      description: ocprobe is conservative by design. Would this change affect any safety gate (session deletion, mass-removal guard, backups, dry-run default)?
      options:
        - label: This proposal touches a safety gate
        - label: This proposal does not touch any safety gate
