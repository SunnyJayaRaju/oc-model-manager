# Keep the automation on this repository current: only the GitHub Actions
# versions are watched. The Homebrew formula lives in the separate tap
# repository and is updated by the release pipeline, not by Dependabot.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One grouped PR for every action bump. The release path pins and verifies
    # its actions end to end, so individual bump PRs only add noise; the group
    # is still evaluated like any change (CI plus the rehearsal for majors).
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
