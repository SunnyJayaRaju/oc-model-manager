# Keep the automation on this repository current: only the GitHub Actions
# versions are watched. The Homebrew formula lives in the separate tap
# repository and is updated by the release pipeline, not by Dependabot.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One grouped PR for every action bump; individual bump PRs only add noise.
    # CI checks all pull-request jobs. The release path runs only on tags, so
    # CI cannot check it; the rehearsal, not CI, is used for a release.
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # release-job only; neither CI nor the rehearsal runs it; lift this when a
      # release is being prepared, run the rehearsal first
      - dependency-name: "actions/download-artifact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "softprops/action-gh-release"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
