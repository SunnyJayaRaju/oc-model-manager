<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9d6e8;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="200" fill="url(#bgGradient)" rx="12"/>
  <rect x="40" y="40" width="720" height="120" fill="none" stroke="url(#accentGradient)" stroke-width="1.5" rx="8" opacity="0.3"/>

  <!-- terminal traffic-light dots, top-left of the frame -->
  <circle cx="58" cy="56" r="4.5" fill="#ff5f57" opacity="0.85"/>
  <circle cx="74" cy="56" r="4.5" fill="#febc2e" opacity="0.85"/>
  <circle cx="90" cy="56" r="4.5" fill="#28c840" opacity="0.85"/>

  <text x="400" y="86" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="42" font-weight="700" fill="url(#textGradient)" filter="url(#glow)">
    <tspan fill="#00d4aa">$</tspan> ocprobe
  </text>

  <text x="400" y="116" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#9db4cc" letter-spacing="0.4px">
    OpenCode Model Probe
  </text>

  <text x="400" y="140" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#6b7d9a" letter-spacing="0.2px">
    catalog diff  →  live probe  →  safety-gated apply  →  monitor
  </text>

  <g fill="none" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4">
    <line x1="180" y1="160" x2="260" y2="160" stroke-linecap="round"/>
    <line x1="540" y1="160" x2="620" y2="160" stroke-linecap="round"/>
  </g>
  <circle cx="400" cy="160" r="3" fill="url(#accentGradient)" opacity="0.6"/>
</svg>
