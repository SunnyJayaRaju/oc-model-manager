name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  OCM_ROOT: ${{ github.workspace }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          curl -sL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/
      - name: Run shellcheck
        run: shellcheck bin/ocm lib/*.sh
      - name: Check bash syntax
        run: |
          for f in bin/ocm lib/*.sh; do
            bash -n "$f" || exit 1
          done

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-yaml python3-jsonschema sqlite3 coreutils
          # Install bats from source
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats
          cd /tmp/bats
          sudo ./install.sh /usr/local
      - name: Run unit tests
        run: bats test/unit/

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-yaml python3-jsonschema sqlite3 coreutils
          # Install bats from source
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats
          cd /tmp/bats
          sudo ./install.sh /usr/local
      - name: Run integration tests
        run: bats test/integration/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-integration]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Create release package
        run: |
          VERSION=$(cat VERSION)
          mkdir -p dist/ocm-$VERSION
          cp -r bin lib config VERSION CHANGELOG.md LICENSE README.md dist/ocm-$VERSION/
          cd dist
          tar -czf ocm-$VERSION.tar.gz ocm-$VERSION/
          sha256sum ocm-$VERSION.tar.gz > ocm-$VERSION.tar.gz.sha256
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocm-release
          path: dist/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ocm-release
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ocm-*.tar.gz dist/ocm-*.tar.gz.sha256
          generate_release_notes: true

  homebrew:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check for HOMEBREW_TAP_TOKEN
        id: check_token
        run: |
          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set, skipping Homebrew formula update"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version
        if: ${{ steps.check_token.outputs.has_token == 'true' }}
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Checkout homebrew-ocm tap repo
        if: ${{ steps.check_token.outputs.has_token == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-ocm
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
  
      - name: Update formula
        if: ${{ steps.check_token.outputs.has_token == 'true' }}
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/ocm-${VERSION}.tar.gz"
          SHA256=$(curl -sL "$URL.sha256" | cut -d' ' -f1)
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/ocm.rb
          sed -i "s|url \".*\"|url \"${URL}\"|" Formula/ocm.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Formula/ocm.rb

      - name: Commit and push
        if: ${{ steps.check_token.outputs.has_token == 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Formula/ocm.rb
          git commit -m "Update ocm to v${VERSION}"
          git push
        
