name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  OCPROBE_ROOT: ${{ github.workspace }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install shellcheck
        run: |
          curl -sL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/
      - name: Run shellcheck
      # scripts/*.sh is linted too: update-tap-formula.sh is the only
      # shell there and it rewrites a published sha256, so it is exactly
      # the file that must not be left unlinted.
        run: shellcheck --severity=warning bin/ocprobe bin/oc-model-manager bin/oc-model-audit.sh bin/oc-session-backup lib/*.sh scripts/*.sh
      - name: Check bash syntax
        run: |
          for f in bin/ocprobe bin/oc-model-manager bin/oc-model-audit.sh bin/oc-session-backup lib/*.sh scripts/*.sh; do
            bash -n "$f" || exit 1
          done
      - name: Check version consistency (README badge vs VERSION)
        run: make version-check
      # Catches a misspelled GITHUB_*/RUNNER_* built-in. Nothing else in this
      # file would: a typo expands to the empty string rather than failing, so
      # the symptom surfaces in a later step, on a code path (a tag push) that
      # ordinary CI never takes. The one this replaces had been there since the
      # homebrew job was added.
      - name: Check workflow built-in env var names
        run: bash scripts/ci/check-workflow-env.sh

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-unit:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep going on the other platform's failure so a macOS-only break still
      # reports the Linux result (and vice versa) in the same run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-yaml python3-jsonschema sqlite3 coreutils
      - name: Install dependencies (macOS)
        # Homebrew equivalents of the apt packages above. python3-yaml and
        # python3-jsonschema are Debian package names, so they map to a Python
        # venv here: installing into the runner's system/Homebrew python is
        # unreliable (PEP 668 externally-managed-environment), and a venv also
        # guarantees the `python3` the tests invoke is the one that has yaml and
        # jsonschema (lib/config.sh imports both).
        #
        # coreutils is installed for parity only. Homebrew's coreutils provides
        # g-prefixed binaries (gtimeout), not a bare `timeout`; the lib guards
        # every bare `timeout` call with `command -v timeout` and otherwise falls
        # back to a perl alarm, so its absence is not fatal on macOS.
        #
        # `bash` is the important one. macOS ships bash 3.2 as /bin/bash, and
        # this codebase needs >= 4.3 (namerefs). bats re-execs through
        # `#!/usr/bin/env bash`, so without a modern bash first on PATH the
        # whole suite runs under 3.2 and dies on a parse error.
        if: runner.os == 'macOS'
        run: |
          brew install jq sqlite3 coreutils bash
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip pyyaml jsonschema
          # ORDER MATTERS. GITHUB_PATH entries are prepended, and the LAST line
          # written ends up FIRST in PATH. We need the venv to win for `python3`
          # (it has yaml/jsonschema; Homebrew's python3 does not) while Homebrew
          # still wins for `bash` (the venv ships no bash). Writing Homebrew
          # first and the venv last therefore yields: venv, homebrew, ...rest —
          # python3 resolves into the venv and bash falls through to Homebrew.
          # Reversing these two lines makes 54 tests fail with
          # "ModuleNotFoundError: No module named 'yaml'".
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        # Fail here, loudly, rather than letting the suite die later with
        # "conditional binary operator expected" or a missing Python module.
        # The step itself may still run under the runner's /bin/bash, but
        # `bash`/`python3` resolved from PATH are what bats will use.
        run: |
          echo "--- bash ---"
          echo "bash on PATH:  $(command -v bash)"
          echo "system bash:   /bin/bash $(/bin/bash --version | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)"
          bash --version | head -1
          bver=$(bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')
          bmajor=${bver%%.*}; bminor=${bver##*.}
          if [ "$bmajor" -lt 4 ] || { [ "$bmajor" -eq 4 ] && [ "$bminor" -lt 3 ]; }; then
            echo "::error::tests would run under bash $bver; need >= 4.3"
            exit 1
          fi
          echo "--- python ---"
          echo "python3 on PATH: $(command -v python3)"
          python3 --version
          if ! python3 -c 'import yaml, jsonschema' 2>/dev/null; then
            echo "::error::python3 on PATH cannot import yaml and jsonschema (lib/config.sh needs both)"
            python3 -c 'import yaml' 2>&1 | head -3 || true
            exit 1
          fi
          echo "yaml + jsonschema importable: yes"
      - name: Install bats
        # Pinned to the same version on both platforms so the two suites cannot
        # drift apart through a runner's preinstalled bats.
        run: |
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats
          cd /tmp/bats
          sudo ./install.sh /usr/local
      - name: Run unit tests
        run: bats test/unit/

  # The unit suite on the runner's own bash (5.x on ubuntu, Homebrew 5.x on
  # macOS) proves nothing about the floor we advertise. README and ci.yml both
  # claim "bash >= 4.3 (namerefs)", but nothing tested 4.3 -- ubuntu-latest is
  # 5.x, and macOS only adds a *newer* bash than its own 3.2. So the documented
  # minimum was untested, and it was wrong: building a real 4.3.30 and running
  # the suite under it failed 13 tests (see the set -u fix in this PR).
  #
  # This job builds bash 4.3.30 from source, puts it first on PATH so bats
  # re-execs through it, and runs the whole unit suite. It is the regression
  # lock for that minimum.
  test-bash43:
    name: Unit Tests (bash 4.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          # build-essential is for compiling bash; the rest is the same set the
          # ubuntu unit job installs, so the two legs differ only in bash.
          sudo apt-get install -y jq python3 python3-yaml python3-jsonschema \
            sqlite3 coreutils build-essential curl
      - name: Cache the bash 4.3 build
        uses: actions/cache@v4
        with:
          # Compiling bash 4.3.30 costs ~3m20s on every run, which is most of
          # this job. The binary only changes when the version, the pinned
          # source hash, or the runner OS/machine changes -- all of which are
          # in the key -- so a hit restores it in seconds.
          #
          # The hash prefix must stay in step with BASH_SHA256 in
          # scripts/ci/install-bash43.sh; that script asserts the version and
          # fails the job if the restored binary is not 4.3.
          path: ~/bash43
          key: bash43-4.3.30-317881019bbf2262-linux-x64
      - name: Build or restore bash 4.3.30
        # sha256 pin, build flags, PATH wiring and the 4.3 assertion all
        # live in the script so there is one definition of "bash 4.3".
        run: bash scripts/ci/install-bash43.sh
      - name: Verify toolchain
        # Fail loudly rather than silently testing the wrong bash. If the build
        # ever resolves to something else, this job would otherwise go green
        # while proving nothing about 4.3.
        run: |
          echo "bash on PATH: $(command -v bash)"
          bver=$(bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')
          echo "bash on PATH is: $bver"
          if [ "$bver" != "4.3" ]; then
            echo "::error::expected bash 4.3 on PATH, got $bver -- this job would prove nothing"
            exit 1
          fi
          if ! python3 -c 'import yaml, jsonschema' 2>/dev/null; then
            echo "::error::python3 on PATH cannot import yaml and jsonschema"
            exit 1
          fi
      - name: Install bats
        # Same pin as the other legs so the suites cannot drift apart.
        run: |
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats
          cd /tmp/bats
          sudo ./install.sh /usr/local
      - name: Run unit tests
        run: bats test/unit/

  test-integration:
    name: Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-yaml python3-jsonschema sqlite3 coreutils
      - name: Install dependencies (macOS)
        # See the note in test-unit: venv avoids PEP 668 and guarantees the
        # interpreter the tests use has yaml + jsonschema; `bash` is required
        # because macOS /bin/bash is 3.2 and the lib needs >= 4.3. The
        # GITHUB_PATH order (Homebrew first, venv last) is deliberate — see the
        # long comment in test-unit.
        if: runner.os == 'macOS'
        run: |
          brew install jq sqlite3 coreutils bash
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip pyyaml jsonschema
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        run: |
          echo "--- bash ---"
          echo "bash on PATH:  $(command -v bash)"
          echo "system bash:   /bin/bash $(/bin/bash --version | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)"
          bash --version | head -1
          bver=$(bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')
          bmajor=${bver%%.*}; bminor=${bver##*.}
          if [ "$bmajor" -lt 4 ] || { [ "$bmajor" -eq 4 ] && [ "$bminor" -lt 3 ]; }; then
            echo "::error::tests would run under bash $bver; need >= 4.3"
            exit 1
          fi
          echo "--- python ---"
          echo "python3 on PATH: $(command -v python3)"
          python3 --version
          if ! python3 -c 'import yaml, jsonschema' 2>/dev/null; then
            echo "::error::python3 on PATH cannot import yaml and jsonschema (lib/config.sh needs both)"
            python3 -c 'import yaml' 2>&1 | head -3 || true
            exit 1
          fi
          echo "yaml + jsonschema importable: yes"
      - name: Install bats
        run: |
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats
          cd /tmp/bats
          sudo ./install.sh /usr/local
      - name: Run integration tests
        run: bats test/integration/

  # The release tarball has never been checked. The build job assembles it with
  # `cp -r bin lib config docs ...` and `make package` does the same, so
  # lib/session_restore.py -- a Python module, not a .sh -- does ship. But
  # nothing verified that, and nothing verified the *installed* copy works: the
  # unit suite runs from the working tree, where every file is trivially
  # present. A release that dropped the module would install a tool whose
  # `session restore` fails with "no such file", and CI would be green.
  #
  # So this builds the tarball the same way the build job does, installs it
  # into the layout the Homebrew formula uses, and exercises the installed
  # binary. Both legs, because the tar is built on ubuntu and installed on both
  # platforms, and a packaging mistake is exactly the kind of thing that only
  # shows up on one of them.
  package-check:
    name: Package Check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-yaml python3-jsonschema sqlite3 coreutils
      - name: Install dependencies (macOS)
        # Same reasoning and ordering as the unit job.
        #
        # `bash` is not optional here. This job RUNS the installed binary, and
        # on macOS that binary starts under /bin/bash, which is 3.2. ocprobe
        # requires >= 4.3 and refuses to run, so without this the whole macOS leg
        # fails on a property of the runner rather than of the package. The unit
        # job installs bash for the same reason.
        #
        # GITHUB_PATH entries are prepended and the LAST one written ends up
        # FIRST, so the venv is written last: it must win for python3 (it has
        # yaml/jsonschema, Homebrew's does not) while Homebrew still wins for
        # bash (the venv ships none). Reversing these two makes python3 lose
        # yaml and the tool fail at import instead.
        if: runner.os == 'macOS'
        run: |
          brew install jq sqlite3 coreutils bash
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip pyyaml jsonschema
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain
        # Which bash the installed binary will actually run under. Without this
        # the failure mode is a confusing mid-assertion error from ocprobe.
        run: |
          echo "bash on PATH: $(command -v bash)"
          bash --version | head -1
          bver=$(bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')
          bmajor=${bver%%.*}; bminor=${bver##*.}
          if [ "$bmajor" -lt 4 ] || { [ "$bmajor" -eq 4 ] && [ "$bminor" -lt 3 ]; }; then
            echo "::error::the installed binary would run under bash $bver; need >= 4.3"
            exit 1
          fi
          if ! python3 -c 'import yaml, jsonschema' 2>/dev/null; then
            echo "::error::python3 on PATH cannot import yaml and jsonschema"
            exit 1
          fi
      - name: Build the release tarball exactly as the build job does
        run: bash scripts/ci/package-check.sh build
      - name: Verify the packaged file list
        # Separate from the runtime checks on purpose: this one is about *what
        # is in the tarball*, and it must fail even if the binary happens to
        # work from the working tree for some other reason.
        run: bash scripts/ci/package-check.sh verify-tarball
      - name: Install and exercise the installed copy
        run: bash scripts/ci/package-check.sh verify-install
      - name: Show what was installed
        if: always()
        run: bash scripts/ci/package-check.sh show
      - name: Upload the package for inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-check-${{ matrix.os }}
          path: "${{ runner.temp }}/pkgcheck/"
          retention-days: 3

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-integration, test-bash43, package-check]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Check the tag against VERSION
        # Previously: `echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"`, which
        # adopted whatever tag was pushed and overwrote VERSION with it. Tagging
        # v9.9.9 against a tree saying 3.1.2 produced a release claiming 9.9.9
        # with the source's own version discarded, and nothing noticed.
        #
        # The tag goes through `env:`, not into the run: body -- a tag is
        # attacker-influenced text in a general sense and must never be spliced
        # into a shell script. Before any packaging, so a bad tag never produces
        # an artifact.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(bash scripts/ci/check-tag-version.sh)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "validated tag against VERSION: $VERSION"
      - name: Generate man page
        run: |
          pandoc docs/ocprobe.1.md -s -t man -o docs/ocprobe.1
      - name: Create release package
        run: |
          mkdir -p dist/ocprobe-$VERSION
          cp -r bin lib config docs VERSION CHANGELOG.md LICENSE README.md CONTRIBUTING.md dist/ocprobe-$VERSION/
          cd dist
          # COPYFILE_DISABLE=1 is belt-and-braces here: this job runs on
          # ubuntu, where tar is GNU and never emits AppleDouble members. It is
          # set anyway so that if this job is ever moved to a macOS runner the
          # published artifact does not silently gain one ._* file per real
          # file. The Package Check job, which does run on macos-latest, is what
          # actually catches it.
          COPYFILE_DISABLE=1 tar -czf ocprobe-$VERSION.tar.gz ocprobe-$VERSION/
          sha256sum ocprobe-$VERSION.tar.gz > ocprobe-$VERSION.tar.gz.sha256
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocprobe-release
          path: dist/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ocprobe-release
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ocprobe-*.tar.gz
            dist/ocprobe-*.tar.gz.sha256
          generate_release_notes: true

  homebrew:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      # The token is only ever passed through `env:`, never interpolated into a
      # `run:` body. A secret spliced into a shell script is a script-injection
      # vector: whatever it contains is executed as shell.
      - name: Check for HOMEBREW_TAP_TOKEN
        id: check_token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set, skipping Homebrew formula update"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version
        if: ${{ steps.check_token.outputs.has_token == 'true' }}
        env:
          # GITHUB_REF_NAME is already the tag; the script validates its shape
          # again, so a malformed tag fails there rather than producing a URL
          # that 404s into a formula.
          TAG: ${{ github.ref_name }}
        run: |
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          # GITHUBUB_REPOSITORY was a typo for GITHUB_REPOSITORY, which does not
          # exist. The step has no `set -u`, so the expansion was the empty
          # string, and REPO_SLUG reached scripts/update-tap-formula.sh empty --
          # where it trips `die "REPO_SLUG is required"`, a different step, in a
          # job gated on a tag push. No tag has ever been created, so this line
          # had never run. scripts/ci/check-workflow-env.sh now fails the Lint
          # job on any GITHUB_*/RUNNER_* name that is not a real built-in.
          echo "REPO_SLUG=${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"

      - name: Checkout homebrew-ocprobe tap repo
        if: ${{ steps.check_token.outputs.has_token == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-ocprobe
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Replaces the inline shell that used
      #   SHA256=$(curl -sL "$URL.sha256" | cut -d' ' -f1)
      # `curl -sL` has no --fail, so it exits 0 on a 404 and the error page
      # became the formula's sha256. The script downloads the tarball, hashes
      # it, cross-checks it against the published .sha256, and then verifies its
      # own sed edits actually landed.
      - name: Update formula
        id: formula
        if: ${{ steps.check_token.outputs.has_token == 'true' }}
        run: |
          bash scripts/update-tap-formula.sh | tee "$RUNNER_TEMP/formula.log"
          # changed=yes|no on its own line, so re-running for a tag the formula
          # already has is a no-op instead of an empty-commit failure.
          grep -q '^changed=yes$' "$RUNNER_TEMP/formula.log" && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: ${{ steps.check_token.outputs.has_token == 'true' && steps.formula.outputs.changed == 'true' }}
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Formula/ocprobe.rb
          git commit -m "Update ocprobe to ${TAG}"
          git push
