name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  OCPROBE_ROOT: ${{ github.workspace }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install shellcheck
        run: |
          curl -sL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz | tar -xJ
          sudo mv shellcheck-v0.11.0/shellcheck /usr/local/bin/
      - name: Run shellcheck
        run: shellcheck --severity=warning bin/ocprobe bin/oc-model-manager bin/oc-model-audit.sh bin/oc-session-backup lib/*.sh
      - name: Check bash syntax
        run: |
          for f in bin/ocprobe bin/oc-model-manager bin/oc-model-audit.sh bin/oc-session-backup lib/*.sh; do
            bash -n "$f" || exit 1
          done
      - name: Check version consistency (README badge vs VERSION)
        run: make version-check

  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-unit:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Keep going on the other platform's failure so a macOS-only break still
      # reports the Linux result (and vice versa) in the same run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-yaml python3-jsonschema sqlite3 coreutils
      - name: Install dependencies (macOS)
        # Homebrew equivalents of the apt packages above. python3-yaml and
        # python3-jsonschema are Debian package names, so they map to a Python
        # venv here: installing into the runner's system/Homebrew python is
        # unreliable (PEP 668 externally-managed-environment), and a venv also
        # guarantees the `python3` the tests invoke is the one that has yaml and
        # jsonschema (lib/config.sh imports both). Added to GITHUB_PATH so the
        # test step below picks it up.
        #
        # coreutils is installed for parity only. Homebrew's coreutils provides
        # g-prefixed binaries (gtimeout), not a bare `timeout`; the lib guards
        # every bare `timeout` call with `command -v timeout` and otherwise falls
        # back to a perl alarm, so its absence is not fatal on macOS.
        if: runner.os == 'macOS'
        run: |
          brew install jq sqlite3 coreutils
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip pyyaml jsonschema
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install bats
        # Pinned to the same version on both platforms so the two suites cannot
        # drift apart through a runner's preinstalled bats.
        run: |
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats
          cd /tmp/bats
          sudo ./install.sh /usr/local
      - name: Run unit tests
        run: bats test/unit/

  test-integration:
    name: Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3 python3-yaml python3-jsonschema sqlite3 coreutils
      - name: Install dependencies (macOS)
        # See the note in test-unit: venv avoids PEP 668 and guarantees the
        # interpreter the tests use has yaml + jsonschema.
        if: runner.os == 'macOS'
        run: |
          brew install jq sqlite3 coreutils
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --upgrade pip pyyaml jsonschema
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Install bats
        run: |
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git /tmp/bats
          cd /tmp/bats
          sudo ./install.sh /usr/local
      - name: Run integration tests
        run: bats test/integration/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-integration]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Generate man page
        run: |
          pandoc docs/ocprobe.1.md -s -t man -o docs/ocprobe.1
      - name: Create release package
        run: |
          mkdir -p dist/ocprobe-$VERSION
          cp -r bin lib config docs VERSION CHANGELOG.md LICENSE README.md CONTRIBUTING.md dist/ocprobe-$VERSION/
          cd dist
          tar -czf ocprobe-$VERSION.tar.gz ocprobe-$VERSION/
          sha256sum ocprobe-$VERSION.tar.gz > ocprobe-$VERSION.tar.gz.sha256
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ocprobe-release
          path: dist/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ocprobe-release
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ocprobe-*.tar.gz
            dist/ocprobe-*.tar.gz.sha256
          generate_release_notes: true

  homebrew:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check for HOMEBREW_TAP_TOKEN
        id: check_token
        run: |
          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set, skipping Homebrew formula update"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version
        if: ${{ steps.check_token.outputs.has_token == 'true' }}
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Checkout homebrew-ocprobe tap repo
        if: ${{ steps.check_token.outputs.has_token == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-ocprobe
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
  
      - name: Update formula
        if: ${{ steps.check_token.outputs.has_token == 'true' }}
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/ocprobe-${VERSION}.tar.gz"
          SHA256=$(curl -sL "$URL.sha256" | cut -d' ' -f1)
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/ocprobe.rb
          sed -i "s|url \".*\"|url \"${URL}\"|" Formula/ocprobe.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Formula/ocprobe.rb

      - name: Commit and push
        if: ${{ steps.check_token.outputs.has_token == 'true' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Formula/ocprobe.rb
          git commit -m "Update ocprobe to v${VERSION}"
          git push
