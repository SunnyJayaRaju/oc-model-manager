name: release-rehearsal

# Rehearse the release -> tap formula update, end to end, with no release.
#
# Why this exists: the whole path (build the tarball, publish it with a .sha256
# asset, point the updater at it, edit the tap formula) only ever ran on a tag
# push, and only ever ran for real once. Everything upstream of "push to the tap"
# was untested, so a mistake in the updater surfaced as a broken published
# formula rather than as a failed rehearsal.
#
# It cannot push anywhere, by construction:
#   - workflow_dispatch only, never on a tag or a push
#   - permissions: contents: read
#   - the tap is checked out over public https, with no token and no credentials
#   - the updater runs against a COPY of the formula in a temp dir
#   - no step in this file invokes git's push, and the rehearsal script contains
#     no git command at all (asserted by a unit test)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    name: Rehearse the release -> tap update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The tap, by public URL and with no credentials. If this ever needs a
      # token to read a public repository, something is wrong with the setup --
      # and a token here would be a token the rehearsal could use to push.
      - name: Check out the tap repo (public, no token)
        uses: actions/checkout@v7
        with:
          repository: SunnyJayaRaju/homebrew-ocprobe
          # Deliberately no `token:`. The default GITHUB_TOKEN is not passed,
          # so this is an anonymous-ish read of a public repo with no
          # credentials left behind for a later step to misuse.

      - name: Rehearse
        run: bash scripts/ci/rehearsal.sh --tap-dir "$GITHUB_WORKSPACE/homebrew-ocprobe"

      - name: Show the built artifact
        if: always()
        run: |
          ls -la .rehearsal/dist/ || true
          echo "--- .sha256 asset ---"
          cat .rehearsal/dist/*.sha256 2>/dev/null || true

      - name: Upload the rehearsal output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-rehearsal
          path: |
            .rehearsal/dist/
            .rehearsal/copy/
          retention-days: 7
